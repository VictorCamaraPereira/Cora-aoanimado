<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu coração ❤️</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@400;600;700&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --pink: #ff3b81;
    --red: #ff1744;
    --light: #ffb3cb;
    --white: #fff;
}

body {
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
        radial-gradient(circle at 50% 45%, rgba(255, 35, 100, .16), transparent 25%),
        radial-gradient(circle at 20% 20%, rgba(255, 80, 150, .10), transparent 30%),
        linear-gradient(135deg, #09000a, #19000d 50%, #050005);
    font-family: Inter, sans-serif;
    color: white;
    cursor: default;
}

/* estrelas / partículas de fundo */
.background {
    position: fixed;
    inset: 0;
    pointer-events: none;
}

.star {
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: white;
    opacity: .25;
    animation: twinkle var(--duration) ease-in-out infinite alternate;
}

@keyframes twinkle {
    from { transform: scale(.5); opacity: .15; }
    to { transform: scale(1.5); opacity: .8; }
}

.scene {
    position: relative;
    z-index: 2;
    width: min(90vw, 700px);
    text-align: center;
}

.badge {
    display: inline-block;
    padding: 8px 16px;
    margin-bottom: 28px;
    border: 1px solid rgba(255, 140, 180, .25);
    border-radius: 999px;
    background: rgba(255, 255, 255, .04);
    backdrop-filter: blur(10px);
    color: #ffc4d7;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    opacity: 0;
    animation: appear 1s .3s forwards;
}

.heart-area {
    position: relative;
    width: 240px;
    height: 220px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
}

/* anéis de brilho */
.ring {
    position: absolute;
    width: 150px;
    height: 150px;
    border: 1px solid rgba(255, 70, 125, .2);
    border-radius: 50%;
    animation: ring 2.5s ease-out infinite;
}

.ring:nth-child(2) {
    animation-delay: .8s;
}

@keyframes ring {
    0% {
        transform: scale(.65);
        opacity: .7;
    }
    100% {
        transform: scale(1.7);
        opacity: 0;
    }
}

/* coração */
.heart {
    position: relative;
    width: 105px;
    height: 105px;
    transform: rotate(-45deg);
    background: linear-gradient(135deg, #ff5a92, #ff1744 60%, #d50035);
    filter:
        drop-shadow(0 0 12px rgba(255, 30, 90, .9))
        drop-shadow(0 0 35px rgba(255, 20, 70, .55));
    animation: beat 1.25s infinite;
    transition: filter .3s;
}

.heart::before,
.heart::after {
    content: "";
    position: absolute;
    width: 105px;
    height: 105px;
    border-radius: 50%;
    background: inherit;
}

.heart::before {
    top: -52px;
    left: 0;
}

.heart::after {
    top: 0;
    left: 52px;
}

.heart-area:hover .heart {
    filter:
        drop-shadow(0 0 18px rgba(255, 50, 110, 1))
        drop-shadow(0 0 55px rgba(255, 20, 70, .85));
}

@keyframes beat {
    0%, 100% {
        transform: rotate(-45deg) scale(1);
    }
    10% {
        transform: rotate(-45deg) scale(1.08);
    }
    20% {
        transform: rotate(-45deg) scale(1);
    }
    30% {
        transform: rotate(-45deg) scale(1.13);
    }
    45%, 100% {
        transform: rotate(-45deg) scale(1);
    }
}

/* brilho dentro do coração */
.heart-shine {
    position: absolute;
    z-index: 5;
    width: 22px;
    height: 45px;
    top: 20px;
    left: 28px;
    border-radius: 50%;
    background: rgba(255,255,255,.3);
    transform: rotate(-45deg);
    filter: blur(4px);
    pointer-events: none;
}

.title {
    margin-top: 20px;
    font-family: "Great Vibes", cursive;
    font-size: clamp(42px, 8vw, 68px);
    font-weight: 400;
    color: #fff;
    text-shadow: 0 0 20px rgba(255, 80, 140, .5);
    opacity: 0;
    animation: appear 1s .8s forwards;
}

.subtitle {
    margin-top: 6px;
    color: rgba(255, 220, 230, .65);
    font-size: 14px;
    opacity: 0;
    animation: appear 1s 1.1s forwards;
}

.hint {
    margin-top: 28px;
    color: rgba(255,255,255,.4);
    font-size: 11px;
    letter-spacing: 1px;
    opacity: 0;
    animation: appear 1s 1.5s forwards;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(15px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* corações que aparecem no clique */
.particle {
    position: fixed;
    z-index: 20;
    pointer-events: none;
    font-size: var(--size);
    color: var(--color);
    text-shadow: 0 0 10px currentColor;
    animation: explode var(--time) cubic-bezier(.15,.7,.25,1) forwards;
}

@keyframes explode {
    0% {
        transform: translate(-50%, -50%) scale(.2) rotate(0deg);
        opacity: 1;
    }
    70% {
        opacity: 1;
    }
    100% {
        transform:
            translate(calc(-50% + var(--x)), calc(-50% + var(--y)))
            scale(0)
            rotate(var(--rotate));
        opacity: 0;
    }
}

/* flash ao clicar */
.flash {
    position: fixed;
    z-index: 10;
    pointer-events: none;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: rgba(255, 100, 150, .8);
    transform: translate(-50%, -50%);
    animation: flash .7s ease-out forwards;
}

@keyframes flash {
    to {
        width: 350px;
        height: 350px;
        opacity: 0;
    }
}

.counter {
    position: fixed;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,.3);
    font-size: 11px;
    letter-spacing: 1px;
}
</style>
</head>

<body>

<div class="background" id="background"></div>

<main class="scene">
    <div class="badge">feito com carinho ✦</div>

    <div class="heart-area" id="heartArea">
        <div class="ring"></div>
        <div class="ring"></div>

        <div class="heart">
            <div class="heart-shine"></div>
        </div>
    </div>

    <h1 class="title">Um coração para você</h1>

    <p class="subtitle">
        porque algumas coisas não precisam de muitas palavras ❤️
    </p>

    <p class="hint">
        CLIQUE NO CORAÇÃO
    </p>
</main>

<div class="counter" id="counter">0 corações enviados</div>

<script>
const background = document.getElementById("background");
const heartArea = document.getElementById("heartArea");
const counter = document.getElementById("counter");

let clicks = 0;

/* cria estrelas */
for (let i = 0; i < 70; i++) {
    const star = document.createElement("span");
    star.className = "star";

    star.style.left = Math.random() * 100 + "%";
    star.style.top = Math.random() * 100 + "%";
    star.style.setProperty("--duration", (1.5 + Math.random() * 4) + "s");

    const size = 1 + Math.random() * 3;
    star.style.width = size + "px";
    star.style.height = size + "px";

    background.appendChild(star);
}

heartArea.addEventListener("click", (event) => {
    clicks++;

    counter.textContent =
        clicks === 1
        ? "1 coração enviado ❤️"
        : `${clicks} corações enviados ❤️`;

    /* flash */
    const flash = document.createElement("div");
    flash.className = "flash";
    flash.style.left = event.clientX + "px";
    flash.style.top = event.clientY + "px";
    document.body.appendChild(flash);

    setTimeout(() => flash.remove(), 700);

    /* explosão de partículas */
    const colors = ["#ff1744", "#ff3b81", "#ff80ab", "#ffffff", "#ffc1d6"];

    for (let i = 0; i < 24; i++) {
        const particle = document.createElement("span");

        particle.className = "particle";
        particle.textContent = Math.random() > .25 ? "♥" : "✦";

        particle.style.left = event.clientX + "px";
        particle.style.top = event.clientY + "px";

        const angle = Math.random() * Math.PI * 2;
        const distance = 80 + Math.random() * 220;

        particle.style.setProperty("--x", Math.cos(angle) * distance + "px");
        particle.style.setProperty("--y", Math.sin(angle) * distance + "px");
        particle.style.setProperty("--size", (10 + Math.random() * 18) + "px");
        particle.style.setProperty("--time", (1 + Math.random() * .8) + "s");
        particle.style.setProperty("--rotate", (Math.random() * 360 - 180) + "deg");
        particle.style.setProperty(
            "--color",
            colors[Math.floor(Math.random() * colors.length)]
        );

        document.body.appendChild(particle);

        setTimeout(() => particle.remove(), 2000);
    }
});
</script>

</body>
</html>
